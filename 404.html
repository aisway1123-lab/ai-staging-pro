<!DOCTYPE html>
<html lang="zh-TW">
<head>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到頁面｜AI Staging Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#2C4A3E;--gold:#A8844A;--bg:#F7F5F0;--ink:#1A1A18;--ink-muted:#8A8880;--border:rgba(26,26,24,0.1);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:'DM Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{text-align:center;padding:3rem 2rem;max-width:400px;}
.code{font-size:5rem;font-weight:500;color:var(--gold);font-family:'Shippori Mincho',serif;line-height:1;margin-bottom:1rem;}
.title{font-family:'Shippori Mincho',serif;font-size:1.4rem;font-weight:500;color:var(--ink);margin-bottom:0.8rem;}
.sub{font-size:11px;color:var(--ink-muted);line-height:1.8;margin-bottom:2.5rem;letter-spacing:0.05em;}
.btn{display:inline-block;padding:11px 28px;background:var(--green);color:white;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;transition:background 0.2s;margin:4px;}
.btn:hover{background:#3D6355;}
.btn.outline{background:transparent;border:1px solid var(--green);color:var(--green);}
.btn.outline:hover{background:var(--green);color:white;}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <div class="title">找不到這個頁面</div>
  <div class="sub">您所尋找的頁面不存在或已移除。<br>請確認網址是否正確，或返回首頁繼續使用。</div>
  <a class="btn" href="/">返回首頁</a>
  <a class="btn outline" href="/pricing.html">查看方案</a>
</div>
</body>
</html>

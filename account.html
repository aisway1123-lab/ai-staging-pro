<style>
:root{
  --bg:#F7F5F0;--bg-2:#FFFFFF;--bg-3:#F0EDE6;--bg-4:#E8E4DC;
  --ink:#1A1A18;--ink-2:#3D3D3A;--ink-muted:#8A8880;--ink-subtle:#C4C0B8;
  --green:#2C4A3E;--green-2:#3D6355;--green-light:#EBF0EE;
  --gold:#A8844A;--gold-light:#C4A468;--gold-pale:#F5EFE4;
  --border:rgba(26,26,24,0.1);--border-2:rgba(26,26,24,0.06);
  --shadow:0 1px 3px rgba(26,26,24,0.08),0 4px 16px rgba(26,26,24,0.04);
  --shadow-lg:0 4px 24px rgba(26,26,24,0.12);
  --danger:#C04B3A;
  --font-display:'Shippori Mincho',serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:300;min-height:100vh;-webkit-font-smoothing:antialiased;}

header{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 48px;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(247,245,240,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;}
.logo-main{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--green);letter-spacing:0.04em;}
.logo-divider{width:1px;height:14px;background:var(--ink-subtle);align-self:center;}
.logo-sub{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);letter-spacing:0.18em;text-transform:uppercase;}
.header-right{display:flex;align-items:center;gap:12px;}
.back-btn{padding:7px 18px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--green);background:transparent;border:1px solid var(--green);cursor:pointer;transition:all 0.2s;text-decoration:none;}
.back-btn:hover{background:var(--green);color:white;}
.user-info{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);}

.main{max-width:640px;margin:0 auto;padding:96px 48px 80px;}
.page-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.page-eyebrow::before{content:'';width:20px;height:1px;background:var(--gold);}
.page-title{font-family:var(--font-display);font-size:2rem;font-weight:500;color:var(--ink);margin-bottom:2rem;}

.section{background:var(--bg-2);border:1px solid var(--border);padding:2rem;margin-bottom:1.5rem;box-shadow:var(--shadow);}
.section-title{font-family:var(--font-mono);font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:1.4rem;display:flex;align-items:center;gap:12px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

.plan-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:var(--green-light);border:1px solid rgba(44,74,62,0.2);margin-bottom:1rem;}
.plan-badge-text{font-family:var(--font-display);font-size:1.1rem;font-weight:500;color:var(--green);}
.plan-badge-dot{width:8px;height:8px;background:var(--green);border-radius:50%;}

.plan-detail{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);line-height:2;letter-spacing:0.04em;}
.plan-detail span{color:var(--ink);font-weight:500;}

.cancel-wrap{margin-top:1.4rem;padding-top:1.4rem;border-top:1px solid var(--border);}
.cancel-title{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:0.8rem;}
.cancel-btn{padding:9px 20px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--danger);background:transparent;border:1px solid rgba(192,75,58,0.3);cursor:pointer;transition:all 0.2s;}
.cancel-btn:hover{background:#FEF0EE;border-color:var(--danger);}
.cancel-info{display:none;margin-top:1rem;padding:1rem 1.2rem;background:#FEF0EE;border:1px solid rgba(192,75,58,0.15);border-left:2px solid var(--danger);}
.cancel-info p{font-size:13px;color:var(--danger);line-height:1.8;}
.cancel-info a{color:var(--danger);font-weight:500;}

.pw-btn{width:100%;padding:13px;background:var(--green);color:white;border:none;font-family:var(--font-mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;}
.pw-btn:hover{background:var(--green-2);}
.pw-btn:disabled{opacity:0.4;cursor:not-allowed;}
.pw-success{display:none;margin-top:1rem;padding:0.9rem 1rem;background:#EBF5F0;border:1px solid rgba(44,74,62,0.2);border-left:2px solid var(--green);font-size:13px;color:var(--green);line-height:1.7;}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:white;padding:10px 22px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;opacity:0;transition:all 0.3s;pointer-events:none;z-index:9999;box-shadow:var(--shadow-lg);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

#authGate{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;padding-top:64px;}
.auth-prompt{background:var(--bg-2);border:1px solid var(--border);padding:2.5rem;text-align:center;max-width:360px;box-shadow:var(--shadow);}
.auth-prompt-title{font-family:var(--font-display);font-size:1.4rem;font-weight:500;margin-bottom:0.5rem;}
.auth-prompt-sub{font-size:13px;color:var(--ink-muted);margin-bottom:1.5rem;line-height:1.7;}
.auth-prompt-btn{display:inline-block;padding:10px 28px;background:var(--green);color:white;font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;transition:background 0.2s;}
.auth-prompt-btn:hover{background:var(--green-2);}

@media(max-width:768px){
  header{padding:0 20px;}
  .main{padding:80px 20px 60px;}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="/">
    <div class="logo-main">AI Staging Pro</div>
    <div class="logo-divider"></div>
    <div class="logo-sub">帳號設定</div>
  </a>
  <div class="header-right">
    <span class="user-info" id="userInfo"></span>
    <a class="back-btn" href="/">← 返回生成</a>
  </div>
</header>

<div id="authGate">
  <div class="auth-prompt">
    <div class="auth-prompt-title">請先登入</div>
    <div class="auth-prompt-sub">登入後即可管理您的帳號設定。</div>
    <a class="auth-prompt-btn" href="/">前往登入</a>
  </div>
</div>

<div class="main" id="mainContent" style="display:none;">
  <div class="page-eyebrow">帳號管理</div>
  <div class="page-title">帳號設定</div>

  <!-- 目前訂閱 -->
  <div class="section">
    <div class="section-title">目前訂閱</div>
    <div id="planLoading" style="font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);">載入中…</div>
    <div id="planContent" style="display:none;">
      <div class="plan-badge">
        <div class="plan-badge-dot"></div>
        <div class="plan-badge-text" id="planName">—</div>
      </div>
      <div class="plan-detail" id="planDetail"></div>
      <!-- 取消訂閱：只對訂閱方案顯示 -->
      <div class="cancel-wrap" id="cancelWrap" style="display:none;">
        <div class="cancel-title">取消訂閱</div>
        <button class="cancel-btn" onclick="showCancelInfo()">申請取消訂閱</button>
        <div class="cancel-info" id="cancelInfo">
          <p>如需取消訂閱，請透過 LINE 客服聯繫我們，將由專人為您處理。<br>
          LINE：<a href="https://line.me/R/ti/p/@536vcequ">@536vcequ</a><br><br>
          取消後服務將持續至本期結束，不退差額。</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 修改密碼 -->
  <div class="section">
    <div class="section-title">密碼設定</div>
    <p style="font-size:13px;color:var(--ink-muted);line-height:1.8;margin-bottom:1.4rem;">
      點擊下方按鈕，系統將發送密碼重設信至您的登入信箱。
    </p>
    <button class="pw-btn" id="pwBtn" onclick="sendResetEmail()">發送密碼重設信</button>
    <div class="pw-success" id="pwSuccess">
      密碼重設信已發送至您的信箱，請點擊信中連結完成重設。<br>
      若未收到，請檢查垃圾信件夾，或稍後再試。
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const _sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
let currentUser = null;
let currentProfile = null;

const PLAN_NAMES = {
  free:        '免費用戶',
  trial:       '試用方案',
  trial_pending: '試用審核中',
  subscriber:  '訂閱用戶',
  manager:     '管理員',
  admin:       '系統管理員',
};

const PLAN_LEVEL_NAMES = {
  mini:     '迷你方案',
  standard: '標準方案',
};

const BILLING_NAMES = {
  monthly: '月繳',
  yearly:  '年繳',
};

async function init(){
  const { data:{ session } } = await _sb.auth.getSession();
  if(!session?.user){
    document.getElementById('authGate').style.display = 'flex';
    return;
  }
  currentUser = session.user;
  document.getElementById('userInfo').textContent = session.user.email?.split('@')[0];
  document.getElementById('mainContent').style.display = 'block';
  loadProfile();

  _sb.auth.onAuthStateChange(async(event, session) => {
    if(event === 'SIGNED_OUT'){ window.location.href = '/'; return; }
    if(event === 'TOKEN_REFRESH_FAILED'){
      try{ await _sb.auth.signOut(); }catch(e){}
      window.location.href = '/';
      return;
    }
    if(event === 'TOKEN_REFRESHED' && session?.user) currentUser = session.user;
  });
}

async function loadProfile(){
  const { data: profile } = await _sb.from('profiles')
    .select('role, plan_level, plan_billing, plan_started_at, trial_expires_at')
    .eq('id', currentUser.id)
    .single();

  currentProfile = profile;
  document.getElementById('planLoading').style.display = 'none';
  document.getElementById('planContent').style.display = 'block';

  if(!profile){ showPlanInfo('free', null); return; }
  showPlanInfo(profile.role, profile);
}

function showPlanInfo(role, profile){
  const nameEl   = document.getElementById('planName');
  const detailEl = document.getElementById('planDetail');
  const cancelEl = document.getElementById('cancelWrap');

  // 方案名稱
  let planName = PLAN_NAMES[role] || role;
  if(role === 'subscriber' && profile?.plan_level){
    const level   = PLAN_LEVEL_NAMES[profile.plan_level] || profile.plan_level;
    const billing = BILLING_NAMES[profile.plan_billing] || profile.plan_billing;
    planName = `${level}（${billing}）`;
  }
  nameEl.textContent = planName;

  // 方案詳情
  let detail = '';
  if(role === 'trial'){
    const exp = profile?.trial_expires_at ? fmtDate(profile.trial_expires_at) : '—';
    const isExpired = profile?.trial_expires_at && new Date(profile.trial_expires_at) < new Date();
    detail = isExpired
      ? `試用已到期，請 <a href="/pricing.html" style="color:var(--green);font-weight:500;">選擇方案</a> 繼續使用。`
      : `試用到期日：<span>${exp}</span>`;
  } else if(role === 'subscriber' && profile?.plan_billing){
    const started = profile?.plan_started_at ? fmtDate(profile.plan_started_at) : '—';
    detail = `訂閱開始日：<span>${started}</span>`;
    cancelEl.style.display = 'block';
  } else if(role === 'free'){
    detail = `目前為免費用戶，<a href="/pricing.html" style="color:var(--green);font-weight:500;">升級方案</a> 開始使用。`;
  } else if(role === 'trial_pending'){
    detail = '您的試用申請正在審核中，審核通過後將收到 Email 通知。';
  }

  detailEl.innerHTML = detail;
}

function showCancelInfo(){
  const info = document.getElementById('cancelInfo');
  info.style.display = info.style.display === 'block' ? 'none' : 'block';
}

async function sendResetEmail(){
  const btn = document.getElementById('pwBtn');
  btn.disabled = true;
  btn.textContent = '發送中…';
  try{
    const { error } = await _sb.auth.resetPasswordForEmail(currentUser.email, {
      redirectTo: `${window.location.origin}/reset-password.html`
    });
    if(error) throw error;
    document.getElementById('pwSuccess').style.display = 'block';
    btn.textContent = '已發送';
  }catch(e){
    showToast('發送失敗，請稍後再試');
    btn.disabled = false;
    btn.textContent = '發送密碼重設信';
  }
}

function fmtDate(str){
  if(!str) return '—';
  const d = new Date(str);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

init();
</script>
</body>
</html>

<style>
:root{
  --bg:#F7F5F0;--bg-2:#FFFFFF;--bg-3:#F0EDE6;--bg-4:#E8E4DC;
  --ink:#1A1A18;--ink-2:#3D3D3A;--ink-muted:#8A8880;--ink-subtle:#C4C0B8;
  --green:#2C4A3E;--green-2:#3D6355;--green-light:#EBF0EE;
  --gold:#A8844A;--gold-light:#C4A468;--gold-pale:#F5EFE4;
  --border:rgba(26,26,24,0.1);--border-2:rgba(26,26,24,0.06);
  --shadow:0 1px 3px rgba(26,26,24,0.08),0 4px 16px rgba(26,26,24,0.04);
  --shadow-lg:0 4px 24px rgba(26,26,24,0.12);
  --font-display:'Shippori Mincho',serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
  --danger:#C04B3A;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:300;min-height:100vh;-webkit-font-smoothing:antialiased;}

/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 48px;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(247,245,240,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;}
.logo-main{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--green);letter-spacing:0.04em;}
.logo-divider{width:1px;height:14px;background:var(--ink-subtle);align-self:center;}
.logo-sub{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);letter-spacing:0.18em;text-transform:uppercase;}
.header-right{display:flex;align-items:center;gap:12px;}
.back-btn{padding:7px 18px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--green);background:transparent;border:1px solid var(--green);cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.back-btn:hover{background:var(--green);color:white;}
.user-info{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);}

/* Main */
.main{max-width:1120px;margin:0 auto;padding:88px 48px 60px;}
.page-header{margin-bottom:2rem;}
.page-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.page-eyebrow::before{content:'';width:20px;height:1px;background:var(--gold);}
.page-title{font-family:var(--font-display);font-size:2rem;font-weight:500;color:var(--ink);margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--ink-muted);font-weight:300;}

/* Stats bar */
.stats-bar{display:flex;gap:1px;background:var(--border);margin-bottom:2rem;box-shadow:var(--shadow);}
.stat-item{flex:1;background:var(--bg-2);padding:1rem 1.4rem;}
.stat-num{font-family:var(--font-display);font-size:1.6rem;font-weight:400;color:var(--green);line-height:1;}
.stat-label{font-family:var(--font-mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink-muted);margin-top:4px;}

/* Filter bar */
.filter-bar{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;}
.filter-btn{padding:6px 16px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid var(--border);background:var(--bg-2);color:var(--ink-muted);cursor:pointer;transition:all 0.2s;}
.filter-btn:hover{border-color:var(--green);color:var(--green);}
.filter-btn.active{background:var(--green);color:white;border-color:var(--green);}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}

/* Card */
.card{background:var(--bg-2);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow 0.2s;}
.card:hover{box-shadow:var(--shadow-lg);}
.card-media{position:relative;background:var(--bg-3);aspect-ratio:16/10;overflow:hidden;}
.card-media img,.card-media video{width:100%;height:100%;object-fit:cover;}
.card-media-placeholder{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:2rem;opacity:0.2;}
.card-badge{position:absolute;top:10px;left:10px;font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;}
.badge-image{background:rgba(44,74,62,0.85);color:white;}
.badge-video{background:rgba(168,132,74,0.85);color:white;}
.badge-expired{background:rgba(192,75,58,0.85);color:white;}
.card-expire{position:absolute;top:10px;right:10px;font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,0.8);background:rgba(0,0,0,0.5);padding:3px 8px;}
.card-body{padding:14px 16px;}
.card-style{font-family:var(--font-display);font-size:14px;font-weight:500;color:var(--ink);margin-bottom:3px;}
.card-room{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);letter-spacing:0.06em;}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-2);}
.card-date{font-family:var(--font-mono);font-size:10px;color:var(--ink-subtle);}
.card-credits{font-family:var(--font-mono);font-size:10px;color:var(--gold);}
.card-actions{display:flex;gap:6px;margin-top:10px;}
.card-btn{flex:1;padding:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--border);background:transparent;color:var(--ink-muted);cursor:pointer;transition:all 0.2s;}
.card-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-light);}
.card-btn.primary{background:var(--green);color:white;border-color:var(--green);}
.card-btn.primary:hover{background:var(--green-2);}
.card-btn:disabled{opacity:0.35;cursor:not-allowed;}

/* Empty / Loading */
.empty{text-align:center;padding:4rem 2rem;color:var(--ink-muted);}
.empty-icon{font-size:3rem;margin-bottom:1rem;opacity:0.25;}
.empty-title{font-family:var(--font-display);font-size:1.2rem;color:var(--ink-muted);margin-bottom:0.5rem;}
.empty-sub{font-size:13px;color:var(--ink-subtle);}
.empty-cta{display:inline-block;margin-top:1.5rem;padding:10px 24px;background:var(--green);color:white;font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;transition:background 0.2s;}
.empty-cta:hover{background:var(--green-2);}
.loading{text-align:center;padding:4rem;color:var(--ink-muted);font-family:var(--font-mono);font-size:12px;}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(44,74,62,0.15);border-top-color:var(--green);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Auth gate */
#authGate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1rem;padding-top:64px;}
.auth-prompt{background:var(--bg-2);border:1px solid var(--border);padding:2.5rem;text-align:center;max-width:360px;box-shadow:var(--shadow);}
.auth-prompt-title{font-family:var(--font-display);font-size:1.4rem;font-weight:500;color:var(--ink);margin-bottom:0.5rem;}
.auth-prompt-sub{font-size:13px;color:var(--ink-muted);margin-bottom:1.5rem;line-height:1.7;}
.auth-prompt-btn{display:inline-block;padding:10px 28px;background:var(--green);color:white;font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;transition:background 0.2s;}
.auth-prompt-btn:hover{background:var(--green-2);}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:white;padding:10px 22px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;opacity:0;transition:all 0.3s;pointer-events:none;z-index:9999;box-shadow:var(--shadow-lg);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.credits-section{margin-bottom:2rem;}
.credits-section-title{font-family:var(--font-display);font-size:1.2rem;font-weight:500;color:var(--ink);margin-bottom:1rem;display:flex;align-items:center;gap:10px;}
.credits-section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.credits-tabs{display:flex;gap:0;margin-bottom:1.2rem;border-bottom:1px solid var(--border);}
.credits-tab{padding:8px 20px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;}
.credits-tab:hover{color:var(--ink);}
.credits-tab.active{color:var(--green);border-bottom-color:var(--green);}
.credits-table{background:var(--bg-2);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;}
.credits-table table{width:100%;border-collapse:collapse;}
.credits-table th{padding:10px 16px;font-family:var(--font-mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink-muted);text-align:left;font-weight:400;border-bottom:1px solid var(--border);background:var(--bg-3);}
.credits-table td{padding:12px 16px;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--border-2);vertical-align:middle;}
.credits-table tr:last-child td{border-bottom:none;}
.credits-table tr:hover td{background:var(--green-light);}
.debit{color:var(--danger);font-family:var(--font-mono);font-size:11px;font-weight:500;}
.credit-in{color:var(--green);font-family:var(--font-mono);font-size:11px;font-weight:500;}
.badge-gen{background:rgba(26,26,24,0.06);color:var(--ink-muted);font-family:var(--font-mono);font-size:9px;padding:2px 7px;letter-spacing:0.06em;}
.badge-purchase{background:var(--green-light);color:var(--green);font-family:var(--font-mono);font-size:9px;padding:2px 7px;letter-spacing:0.06em;}
.badge-trial{background:var(--gold-pale);color:var(--gold);font-family:var(--font-mono);font-size:9px;padding:2px 7px;letter-spacing:0.06em;}
.empty-credits{padding:2.5rem;text-align:center;color:var(--ink-subtle);font-family:var(--font-mono);font-size:12px;}

/* Lightbox */
.lightbox{/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px;}
.lightbox.open{display:flex;}
.lightbox-content{max-width:90vw;max-height:90vh;position:relative;}
.lightbox-content img,.lightbox-content video{max-width:100%;max-height:85vh;object-fit:contain;}
.lightbox-close{position:absolute;top:-36px;right:0;background:none;border:none;color:white;font-size:1.2rem;cursor:pointer;font-family:var(--font-mono);opacity:0.7;}
.lightbox-close:hover{opacity:1;}

@media(max-width:768px){
  header{padding:0 20px;}
  .main{padding:80px 20px 40px;}
  .grid{grid-template-columns:1fr;}
  .stats-bar{flex-wrap:wrap;}
  .stat-item{flex:1;min-width:120px;}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="/">
    <div class="logo-main">AI Staging Pro</div>
    <div class="logo-divider"></div>
    <div class="logo-sub">我的紀錄</div>
  </a>
  <div class="header-right">
    <span class="user-info" id="userInfo"></span>
    <a class="back-btn" href="/">← 返回生成</a>
  </div>
</header>

<!-- 未登入提示 -->
<div id="authGate" style="display:none;">
  <div class="auth-prompt">
    <div class="auth-prompt-title">請先登入</div>
    <div class="auth-prompt-sub">登入後即可查看您的所有生成紀錄、下載圖片和影片。</div>
    <a class="auth-prompt-btn" href="/">前往登入</a>
  </div>
</div>

<div class="main" id="mainContent" style="display:none;">
  <div class="page-header">
    <div class="page-eyebrow">生成歷史</div>
    <div class="page-title">我的紀錄</div>
    <div class="page-sub">圖片保存 60 天，影片保存 30 天，請及時下載</div>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><div class="stat-num" id="statTotal">—</div><div class="stat-label">總生成次數</div></div>
    <div class="stat-item"><div class="stat-num" id="statCredits">—</div><div class="stat-label">累計消耗點數</div></div>
    <div class="stat-item"><div class="stat-num" id="statImages">—</div><div class="stat-label">效果圖</div></div>
    <div class="stat-item"><div class="stat-num" id="statVideos">—</div><div class="stat-label">影片</div></div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterLogs('all',this)">全部</button>
    <button class="filter-btn" onclick="filterLogs('image',this)">效果圖</button>
    <button class="filter-btn" onclick="filterLogs('video',this)">影片</button>
    <button class="filter-btn" onclick="filterLogs('expiring',this)">即將到期</button>
  </div>

  <div id="gridContainer">
    <div class="loading"><span class="spin"></span>載入中…</div>
  </div>

  <!-- 點數收支明細 -->
  <div class="credits-section">
    <div class="credits-section-title">點數收支明細</div>
    <div class="credits-tabs">
      <button class="credits-tab active" onclick="switchCreditsTab('all',this)">全部</button>
      <button class="credits-tab" onclick="switchCreditsTab('debit',this)">消費紀錄</button>
      <button class="credits-tab" onclick="switchCreditsTab('credit',this)">儲值紀錄</button>
    </div>
    <div class="credits-table">
      <table>
        <thead>
          <tr>
            <th>類型</th>
            <th>說明</th>
            <th>點數</th>
            <th>時間</th>
          </tr>
        </thead>
        <tbody id="creditsTableBody">
          <tr><td colspan="4" class="empty-credits">載入中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Lightbox 由 JS 動態插入 -->

<div class="toast" id="toast"></div>

<script>
const _sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
let currentUser = null;
let allLogs = [];

const STYLE_LABELS = {
  japanese_muji_wabi_sabi:'日式無印/侘寂',
  natural_biophilic:'自然系/綠意',
  scandinavian_warm:'溫暖北歐風',
  modern_quiet_luxury:'現代質感輕奢',
  retro_modern_tw:'台味復古',
  korean_instagrammable_adult:'韓系網美風'
};
const ROOM_LABELS = {
  bedroom:'臥室',living_room:'客廳',dining_room:'餐廳',
  kitchen:'廚房',study:'書房',multi_purpose:'多功能房'
};

async function init(){
  const { data:{ session } } = await _sb.auth.getSession();
  if(!session?.user){
    document.getElementById('authGate').style.display = 'flex';
    return;
  }
  currentUser = session.user;
  document.getElementById('userInfo').textContent = session.user.email?.split('@')[0];
  document.getElementById('mainContent').style.display = 'block';
  loadLogs();
  loadCreditsHistory();
  // 監聽 session 變化，防止 token 過期自動登出
  _sb.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_OUT') window.location.href = '/';
    if(event === 'TOKEN_REFRESHED' && session?.user) currentUser = session.user;
  });
}

let allCreditsHistory = [];

async function loadCreditsHistory(){
  // 載入消費紀錄（generation_logs）
  const { data: genLogs } = await _sb.from('generation_logs')
    .select('id, style, room_type, credits_used, created_at')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  // 載入儲值紀錄（orders）
  const { data: orders } = await _sb.from('orders')
    .select('id, plan_type, credits, amount, status, created_at, paid_at')
    .eq('user_id', currentUser.id)
    .eq('status', 'paid')
    .order('created_at', { ascending: false });

  // 載入試用資訊（profiles）
  const { data: profile } = await _sb.from('profiles')
    .select('trial_expires_at, referred_by, referral_code')
    .eq('id', currentUser.id)
    .single();

  // 消費紀錄
  const debitItems = (genLogs || []).map(l => ({
    type: 'debit',
    label: `${STYLE_LABELS[l.style]||l.style||'—'} × ${ROOM_LABELS[l.room_type]||l.room_type||'—'}`,
    badge: 'gen',
    badgeText: '生成',
    points: -(l.credits_used || 0),
    date: l.created_at
  }));

  // 付費儲值紀錄
  const creditItems = (orders || []).map(o => ({
    type: 'credit',
    label: PLAN_LABELS[o.plan_type] || o.plan_type,
    badge: 'purchase',
    badgeText: '儲值',
    points: +(o.credits || 0),
    amount: o.amount,
    date: o.paid_at || o.created_at
  }));

  // 試用核准點數（若有 trial_expires_at 表示曾核准試用）
  const trialItems = [];
  if(profile?.trial_expires_at){
    const trialStart = new Date(new Date(profile.trial_expires_at).getTime() - 7*24*60*60*1000);
    trialItems.push({
      type: 'credit',
      label: '試用核准',
      badge: 'trial',
      badgeText: '試用',
      points: 60,
      amount: null,
      date: trialStart.toISOString()
    });
  }

  allCreditsHistory = [...debitItems, ...creditItems, ...trialItems]
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  renderCreditsTable(allCreditsHistory);
}

const PLAN_LABELS = {
  mini_monthly:'迷你月費 300點',
  standard_monthly:'標準月費 1,000點',
  mini_yearly:'迷你年費 3,600點',
  standard_yearly:'標準年費 12,000點',
  credits_100:'入門點數包 100點',
  credits_300:'標準點數包 300點',
  credits_600:'超值點數包 600點',
};

function switchCreditsTab(type, btn){
  document.querySelectorAll('.credits-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if(type === 'all') renderCreditsTable(allCreditsHistory);
  else renderCreditsTable(allCreditsHistory.filter(i => i.type === type));
}

function renderCreditsTable(list){
  const tbody = document.getElementById('creditsTableBody');
  if(!list || list.length === 0){
    tbody.innerHTML = '<tr><td colspan="4" class="empty-credits">暫無紀錄</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(item => `
    <tr>
      <td><span class="badge-${item.badge}">${item.badgeText}</span></td>
      <td style="color:var(--ink)">${item.label}${item.amount ? ` <span style="color:var(--ink-subtle);font-size:11px;">NT$${item.amount}</span>` : ''}</td>
      <td class="${item.type === 'debit' ? 'debit' : 'credit-in'}">${item.type === 'debit' ? '' : '+'}${item.points} 點</td>
      <td style="font-family:var(--font-mono);font-size:11px;">${fmtDate(item.date)}</td>
    </tr>`).join('');
}

async function loadLogs(){
  const { data, error } = await _sb.from('generation_logs')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  if(error || !data){
    document.getElementById('gridContainer').innerHTML = '<div class="loading">載入失敗，請重新整理</div>';
    return;
  }

  allLogs = data;
  updateStats(data);
  renderGrid(data, 'all');
}

function updateStats(logs){
  document.getElementById('statTotal').textContent   = logs.length;
  document.getElementById('statCredits').textContent = logs.reduce((s,l) => s + (l.credits_used||0), 0);
  document.getElementById('statImages').textContent  = logs.filter(l => l.image_url).length;
  document.getElementById('statVideos').textContent  = logs.filter(l => l.video_url).length;
}

function filterLogs(type, btn){
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const now = new Date();
  const in7days = new Date(now.getTime() + 7*24*60*60*1000);
  let filtered = allLogs;
  if(type === 'image')    filtered = allLogs.filter(l => l.image_url);
  if(type === 'video')    filtered = allLogs.filter(l => l.video_url);
  if(type === 'expiring') filtered = allLogs.filter(l => l.expires_at && new Date(l.expires_at) < in7days && new Date(l.expires_at) > now);
  renderGrid(filtered, type);
}

function renderGrid(logs, filterType){
  const container = document.getElementById('gridContainer');
  if(!logs || logs.length === 0){
    const isExpiring = filterType === 'expiring';
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${isExpiring ? '✅' : '🏠'}</div>
        <div class="empty-title">${isExpiring ? '目前沒有即將到期的紀錄' : '還沒有生成紀錄'}</div>
        <div class="empty-sub">${isExpiring ? '所有生成紀錄都在安全期內' : '上傳空屋照，選擇風格，開始生成您的第一個作品'}</div>
        ${isExpiring ? '' : '<a class="empty-cta" href="/">開始生成</a>'}
      </div>`;
    return;
  }

  const now = new Date();
  container.innerHTML = `<div class="grid">${logs.map(log => {
    const expired   = log.expires_at && new Date(log.expires_at) < now;
    const expiring  = log.expires_at && !expired && (new Date(log.expires_at) - now) < 7*24*60*60*1000;
    const daysLeft  = log.expires_at ? Math.ceil((new Date(log.expires_at) - now) / (24*60*60*1000)) : null;
    const styleLabel = STYLE_LABELS[log.style] || log.style || '—';
    const roomLabel  = ROOM_LABELS[log.room_type] || log.room_type || '—';
    const hasImage   = log.image_url && !expired;
    const hasVideo   = log.video_url && !expired;
    const mediaHtml  = hasVideo
      ? `<video src="${log.video_url}" muted loop playsinline style="width:100%;height:100%;object-fit:cover;" onmouseenter="this.play()" onmouseleave="this.pause()"></video>`
      : hasImage
        ? `<img src="${log.image_url}" alt="${styleLabel}" loading="lazy">`
        : `<div class="card-media-placeholder">🖼️</div>`;

    return `<div class="card">
      <div class="card-media">
        ${mediaHtml}
        <span class="card-badge ${hasVideo?'badge-video':expired?'badge-expired':'badge-image'}">
          ${expired ? '已過期' : hasVideo ? '影片' : '效果圖'}
        </span>
        ${daysLeft !== null && !expired ? `<span class="card-expire" style="${expiring?'background:rgba(192,75,58,0.7)':''}">
          ${daysLeft} 天後到期
        </span>` : ''}
      </div>
      <div class="card-body">
        <div class="card-style">${styleLabel}</div>
        <div class="card-room">${roomLabel}</div>
        <div class="card-meta">
          <span class="card-date">${fmtDate(log.created_at)}</span>
          <span class="card-credits">消耗 ${log.credits_used||0} 點</span>
        </div>
        <div class="card-actions">
          ${hasImage ? `<button class="card-btn" onclick="openLightbox('image','${log.image_url}')">查看效果圖</button>` : ''}
          ${hasImage ? `<button class="card-btn" onclick="downloadFile('${log.image_url}','staging-image.png')">⬇ 圖片</button>` : ''}
          ${hasVideo ? `<button class="card-btn primary" onclick="downloadFile('${log.video_url}','staging-video.mp4')">⬇ 影片</button>` : ''}
          ${expired  ? `<button class="card-btn" disabled>已過期</button>` : ''}
          ${!hasImage && !hasVideo && !expired ? `<button class="card-btn" disabled>檔案處理中</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function openLightbox(type, url){
  const old = document.getElementById('lightbox');
  if(old) old.remove();
  const lb = document.createElement('div');
  lb.id = 'lightbox';
  lb.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:999999;padding:20px;cursor:pointer;';
  lb.onclick = closeLightbox;
  const inner = document.createElement('div');
  inner.id = 'lightboxContent';
  inner.style.cssText = 'position:relative;max-width:90vw;max-height:90vh;cursor:default;';
  inner.onclick = e => e.stopPropagation();
  const closeBtn = '<button onclick="closeLightbox()" style="position:absolute;top:-36px;right:0;background:none;border:none;color:white;font-size:1.2rem;cursor:pointer;opacity:0.8;">✕ 關閉</button>';
  if(type === 'image'){
    inner.innerHTML = closeBtn + '<img src="'+url+'" alt="效果圖" style="max-width:90vw;max-height:85vh;object-fit:contain;display:block;">';
  } else {
    inner.innerHTML = closeBtn + '<video src="'+url+'" controls autoplay style="max-width:90vw;max-height:85vh;"></video>';
  }
  lb.appendChild(inner);
  document.body.appendChild(lb);
}

function closeLightbox(){
  const lb=document.getElementById('lightbox');
  if(lb) lb.remove();
}

async function downloadFile(url, filename){
  try{
    showToast('下載準備中…');
    const res  = await fetch(url);
    const blob = await res.blob();
    const bUrl = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = bUrl; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(bUrl), 5000);
  }catch(e){
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.target = '_blank'; a.click();
  }
}

function fmtDate(str){
  if(!str) return '—';
  const d = new Date(str);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLightbox(); });
init();
</script>

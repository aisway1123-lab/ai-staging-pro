<style>
:root{--green:#2C4A3E;--gold:#A8844A;--bg:#F7F5F0;--ink:#1A1A18;--ink-muted:#8A8880;--border:rgba(26,26,24,0.1);--shadow-lg:0 4px 24px rgba(26,26,24,0.12);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:'DM Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#fff;border:1px solid var(--border);padding:3rem;max-width:420px;width:90%;text-align:center;box-shadow:var(--shadow-lg);}
.icon{font-size:3rem;margin-bottom:1rem;}
.title{font-family:'Shippori Mincho',serif;font-size:1.6rem;font-weight:500;color:var(--ink);margin-bottom:0.5rem;}
.sub{font-size:12px;color:var(--ink-muted);line-height:1.8;margin-bottom:2rem;}
.btn{display:inline-block;padding:11px 28px;background:var(--green);color:white;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;transition:background 0.2s;margin:4px;}
.btn:hover{background:#3D6355;}
.btn.outline{background:transparent;border:1px solid var(--green);color:var(--green);}
.btn.outline:hover{background:var(--green);color:white;}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(44,74,62,0.15);border-top-color:var(--green);border-radius:50%;animation:spin 0.7s linear infinite;margin-bottom:1rem;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="resultBox">
  <div class="spinner"></div>
  <div class="title">確認付款中…</div>
  <div class="sub">正在確認您的付款狀態，請稍候。</div>
</div>
<script>
const _sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const box = document.getElementById('resultBox');
const orderNo = sessionStorage.getItem('pending_order_no');

function showSuccess() {
  sessionStorage.removeItem('pending_order_no');
  box.innerHTML = `
    <div class="icon">✅</div>
    <div class="title">付款成功！</div>
    <div class="sub">點數已自動加入您的帳號，即可開始使用。<br>如有問題請聯繫 LINE 客服：<a href="https://line.me/R/ti/p/@536vcequ" style="color:#2C4A3E;">@536vcequ</a></div>
    <a class="btn" href="/">開始生成</a>
    <a class="btn outline" href="/pricing.html">返回方案頁</a>`;
}

function showFail(msg) {
  box.innerHTML = `
    <div class="icon">❌</div>
    <div class="title">付款未完成</div>
    <div class="sub">${msg || '付款未成功，點數未扣除。'}<br>如有疑問請聯繫 LINE 客服：<a href="https://line.me/R/ti/p/@536vcequ" style="color:#2C4A3E;">@536vcequ</a></div>
    <a class="btn" href="/pricing.html">重新選擇方案</a>
    <a class="btn outline" href="/">返回首頁</a>`;
}

function showTimeout() {
  sessionStorage.removeItem('pending_order_no');
  box.innerHTML = `
    <div class="icon">⏳</div>
    <div class="title">確認中，請稍候</div>
    <div class="sub">付款正在處理中，點數將於確認後自動加入。<br>若長時間未到帳請聯繫 LINE 客服：<a href="https://line.me/R/ti/p/@536vcequ" style="color:#2C4A3E;">@536vcequ</a></div>
    <a class="btn" href="/">返回首頁</a>
    <a class="btn outline" href="/pricing.html">查看方案</a>`;
}

async function pollOrderStatus() {
  if (!orderNo) {
    // 沒有訂單號碼，可能是直接訪問此頁面
    showTimeout();
    return;
  }

  const maxAttempts = 20; // 最多輪詢 20 次（約 60 秒）
  let attempts = 0;

  const poll = async () => {
    attempts++;
    try {
      const { data: order, error } = await _sb
        .from('orders')
        .select('status')
        .eq('order_no', orderNo)
        .single();

      if (error || !order) {
        if (attempts >= maxAttempts) {
          showTimeout();
          return;
        }
        setTimeout(poll, 3000);
        return;
      }

      if (order.status === 'paid') {
        showSuccess();
        return;
      }

      if (order.status === 'failed') {
        showFail('付款失敗，點數未扣除。');
        return;
      }

      // 還是 pending，繼續等
      if (attempts >= maxAttempts) {
        showTimeout();
        return;
      }
      setTimeout(poll, 3000);

    } catch(e) {
      if (attempts >= maxAttempts) {
        showTimeout();
        return;
      }
      setTimeout(poll, 3000);
    }
  };

  // 等 2 秒後開始第一次查詢（給 webhook 一點時間處理）
  setTimeout(poll, 2000);
}

pollOrderStatus();
</script>
</body>
</html>

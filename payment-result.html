<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>付款結果｜AI Staging Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#2C4A3E;--gold:#A8844A;--bg:#F7F5F0;--ink:#1A1A18;--ink-muted:#8A8880;--border:rgba(26,26,24,0.1);--shadow-lg:0 4px 24px rgba(26,26,24,0.12);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:'DM Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#fff;border:1px solid var(--border);padding:3rem;max-width:420px;width:90%;text-align:center;box-shadow:var(--shadow-lg);}
.icon{font-size:3rem;margin-bottom:1rem;}
.title{font-family:'Shippori Mincho',serif;font-size:1.6rem;font-weight:500;color:var(--ink);margin-bottom:0.5rem;}
.sub{font-size:12px;color:var(--ink-muted);line-height:1.8;margin-bottom:2rem;}
.btn{display:inline-block;padding:11px 28px;background:var(--green);color:white;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;transition:background 0.2s;margin:4px;}
.btn:hover{background:#3D6355;}
.btn.outline{background:transparent;border:1px solid var(--green);color:var(--green);}
.btn.outline:hover{background:var(--green);color:white;}
</style>
</head>
<body>
<div class="box" id="resultBox">
  <div class="icon">⏳</div>
  <div class="title">處理中…</div>
  <div class="sub">正在確認付款結果，請稍候。</div>
</div>
<script>
// 從 URL 參數判斷付款結果
const params = new URLSearchParams(window.location.search);
const status = params.get('Status') || params.get('status');
const box = document.getElementById('resultBox');

setTimeout(() => {
  if(status === 'SUCCESS' || !status){
    box.innerHTML = `
      <div class="icon">✅</div>
      <div class="title">付款成功！</div>
      <div class="sub">點數將在幾秒內自動加入您的帳號。<br>如有問題請聯繫 LINE 客服：<a href="https://line.me/R/ti/p/@536vcequ" style="color:#2C4A3E;">@536vcequ</a></div>
      <a class="btn" href="/">開始生成</a>
      <a class="btn outline" href="/library.html">我的紀錄</a>`;
  } else {
    box.innerHTML = `
      <div class="icon">❌</div>
      <div class="title">付款失敗</div>
      <div class="sub">付款未完成，點數未扣除。<br>如有疑問請聯繫 LINE 客服：<a href="https://line.me/R/ti/p/@536vcequ" style="color:#2C4A3E;">@536vcequ</a></div>
      <a class="btn" href="/pricing.html">重新選擇方案</a>
      <a class="btn outline" href="/">返回首頁</a>`;
  }
}, 1500);
</script>
</body>
</html>

<style>
:root{
  --bg:#F7F5F0;--bg-2:#FFFFFF;
  --ink:#1A1A18;--ink-muted:#8A8880;--ink-subtle:#C4C0B8;
  --green:#2C4A3E;--green-2:#3D6355;
  --border:rgba(26,26,24,0.1);
  --shadow-lg:0 4px 24px rgba(26,26,24,0.12);
  --font-display:'Shippori Mincho',serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;}
.box{background:var(--bg-2);border:1px solid var(--border);padding:2.5rem;max-width:400px;width:90%;box-shadow:var(--shadow-lg);}
.box::before{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--green),#C4A468);margin:-2.5rem -2.5rem 2rem;}
.logo{font-family:var(--font-mono);font-size:10px;letter-spacing:0.3em;color:var(--green);text-transform:uppercase;margin-bottom:1.2rem;}
.title{font-family:var(--font-display);font-size:1.6rem;font-weight:500;color:var(--ink);margin-bottom:0.4rem;}
.sub{font-size:13px;color:var(--ink-muted);margin-bottom:1.6rem;line-height:1.7;}
.label{display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px;font-family:var(--font-mono);}
.input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--ink);font-family:var(--font-body);font-size:14px;padding:10px 12px;outline:none;transition:border-color 0.2s;margin-bottom:1rem;}
.input:focus{border-color:var(--green);}
.btn{width:100%;padding:13px;background:var(--green);color:white;border:none;font-family:var(--font-mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;margin-top:0.4rem;}
.btn:hover{background:var(--green-2);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.msg{padding:0.8rem 1rem;margin-bottom:1rem;font-size:13px;line-height:1.7;display:none;}
.msg.error{background:#FEF0EE;border:1px solid rgba(192,75,58,0.2);color:#C04B3A;display:block;}
.msg.success{background:#EBF5F0;border:1px solid rgba(44,74,62,0.2);color:var(--green);display:block;}
.spin{display:inline-block;width:12px;height:12px;border:1.5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">AI Staging Pro</div>
  <div class="title" id="pageTitle">重設密碼</div>
  <div class="sub" id="pageSub">請輸入您的新密碼。</div>
  <div class="msg" id="msg"></div>
  <div id="formArea">
    <label class="label">新密碼（至少 8 字元）</label>
    <input class="input" type="password" id="pw1" placeholder="輸入新密碼">
    <label class="label">確認新密碼</label>
    <input class="input" type="password" id="pw2" placeholder="再次輸入新密碼">
    <button class="btn" id="submitBtn" onclick="doReset()">確認重設密碼</button>
  </div>
</div>

<script>
const _sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// 監聽 PASSWORD_RECOVERY 事件，Supabase 在用戶點信中連結後會觸發
_sb.auth.onAuthStateChange(async(event, session) => {
  if(event === 'PASSWORD_RECOVERY'){
    // 用戶已透過 email 連結驗證，可以設定新密碼
    document.getElementById('pageSub').textContent = '請輸入您的新密碼，設定完成後將自動登入。';
  }
});

async function doReset(){
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');

  msg.className = 'msg';
  msg.textContent = '';

  if(pw1.length < 8){
    msg.className = 'msg error';
    msg.textContent = '密碼至少需要 8 個字元';
    return;
  }
  if(pw1 !== pw2){
    msg.className = 'msg error';
    msg.textContent = '兩次輸入的密碼不一致';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>處理中…';

  try{
    const { error } = await _sb.auth.updateUser({ password: pw1 });
    if(error) throw error;

    msg.className = 'msg success';
    msg.textContent = '密碼重設成功！即將跳轉至首頁…';
    document.getElementById('formArea').style.display = 'none';

    // 登出舊 session，確保用新密碼重新登入
    setTimeout(async() => {
      await _sb.auth.signOut();
      window.location.href = '/';
    }, 2000);

  }catch(e){
    msg.className = 'msg error';
    msg.textContent = e.message?.includes('expired') ? '重設連結已過期，請重新申請。' : '重設失敗，請稍後再試。';
    btn.disabled = false;
    btn.textContent = '確認重設密碼';
  }
}
</script>
</body>
</html>
